# Cost: $0 on the free tier, within Google's quotas.

name: kit-check-gemini

on:
  workflow_dispatch:  # run by hand only, from the Actions tab

jobs:
  kit-check-gemini:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Harbor (runs the dev tasks)
        run: uv tool install harbor==0.20.0 --with websockets

      - name: Run kit check on the harness (free Gemini key)
        working-directory: ple-kit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_GEMINI_BASE_URL: https://generativelanguage.googleapis.com
        run: uv run python -m kit check ../my-harness
