# How to use it (only if Eddie says yes):
#   1. Eddie creates the repo ple-rubric-first (public, no README) — the
#      repo does NOT exist yet (checked 2026-11-23 09:12 WAT: GitHub
#      returns 404). Then the 113 local files go in, including this file
#      as .github/workflows/kit-check-gemini.yml.
#   2. TEMPORARY change for this smoke check only: in my-harness/
#      submission.yaml, change model_api from
#      google-cloud/claude-opus-5-5 to gemini/gemini-3.8-flash. The kit
